name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Tesseract models
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/tessdata
          key: tessdata-best-eng-rus-uzb-uzbcyrl-v1

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/KitobSkaner-1.0.${{ github.run_number }}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: KitobSkaner-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kitob Skaner 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            📚 **Kitob Skaner** — kitoblarni skanerlab, matnini ajratib, chiroyli PDF kitob yaratadigan ilova.

            **O'rnatish:** quyidagi `KitobSkaner-*.apk` faylini telefoningizga yuklab oling va oching
            ("Noma'lum manbalardan o'rnatish"ga ruxsat bering).

            Branch: `${{ github.ref_name }}` • Commit: `${{ github.sha }}`
